name: Update activity graph

on:
  schedule:
    - cron: "0 3 * * *"   # runs daily at 03:00 UTC
  push:
    paths:
      - ".github/workflows/activity-graph.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate activity graph
        uses: lowlighter/metrics@latest
        with:
          filename: profile/activity-graph.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: SanchilaAmavi
          template: classic
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_visibility: all
          config_display: large
          config_timezone: Asia/Colombo
          config_theme: dark
          config_base_color: "#00C2A8"

      - name: Commit activity graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/activity-graph.svg
          git commit -m "Update activity graph" || exit 0
          git push
